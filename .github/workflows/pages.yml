name: Deploy FromScratch to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install native demo tools
        run: sudo apt-get update && sudo apt-get install -y clang lld jq
      - name: Install dependencies
        run: npm install
      - name: Prepare static runtime sources and web demo
        run: |
          mkdir -p public/source
          cp kernel/runtime.c kernel/extensions_runtime.c public/source/
          bash scripts/build-web-demo.sh
      - name: Download v86 browser assets
        run: bash scripts/fetch-v86.sh
      - name: Check source
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
