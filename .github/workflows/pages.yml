name: Deploy FromScratch to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y clang lld unzip curl grub-pc-bin grub-common xorriso
      - run: npm install
      - run: |
          mkdir -p public/source
          cp kernel/runtime.c kernel/extensions_runtime.c kernel/boot.S kernel/linker.ld public/source/
      - run: bash scripts/build-web-demo.sh
      - run: bash scripts/build-browser-iso-template.sh
      - run: bash scripts/fetch-v86.sh
      - run: bash scripts/fetch-browser-toolchain.sh
      - continue-on-error: true
        run: bash scripts/fetch-qemu64.sh
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
