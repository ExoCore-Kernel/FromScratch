name: Restore complete FromScratch source

on:
  push:
    paths:
      - '.source-bootstrap/**'
      - '.github/workflows/restore-complete-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check archive parts
        id: parts
        shell: bash
        run: |
          missing=0
          for n in 00 01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16; do
            if [ ! -f ".source-bootstrap/part$n" ]; then
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore complete source tree
        if: steps.parts.outputs.ready == 'true'
        shell: bash
        run: |
          cat .source-bootstrap/part?? \
            | base64 -d > /tmp/fromscratch-complete-v0.9.tar.gz

          echo "6d2b709ec3a7fad9a99a073c16c7f55cfde6cb7a433a57658decc8d114e796ab  /tmp/fromscratch-complete-v0.9.tar.gz" | sha256sum -c -

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .source-bootstrap \
            -exec rm -rf {} +

          tar -xzf /tmp/fromscratch-complete-v0.9.tar.gz -C .
          rm -rf .source-bootstrap
          rm -f .github/workflows/restore-complete-source.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore complete FromScratch v0.9 source tree"
          git push
